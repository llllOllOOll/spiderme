if (state == "held") {
<span class="ui-badge ui-badge-held"><span class="hero-clock size-4" aria-hidden="true"></span>Held</span>
} else if (state == "confirmed") {
<span class="ui-badge ui-badge-confirmed"><span class="hero-check size-4" aria-hidden="true"></span>Confirmed</span>
} else if (state == "cancelled") {
<span class="ui-badge ui-badge-cancelled">Cancelled</span>
} else {
<span class="ui-badge ui-badge-expired">Expired</span>
}
