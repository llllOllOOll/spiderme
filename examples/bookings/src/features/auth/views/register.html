extends "layout"
<main class="ui-main">
    <div class="ui-auth">
        <h1 class="ui-h1-sm">Create an account</h1>
        if (problem != "") {
        <div class="ui-alert ui-alert-danger" role="alert"><span class="hero-exclamation-triangle size-5" aria-hidden="true"></span><span>{ problem }</span></div>
        }
        <form class="ui-card ui-form" action="/auth/register" method="post">
            <div class="ui-field">
                <label class="ui-label" for="name">Name</label>
                <input class="ui-input" id="name" name="name" type="text" value="{ name }" placeholder="Your full name" autocomplete="name" required autofocus>
            </div>
            <div class="ui-field">
                <label class="ui-label" for="email">Email</label>
                <input class="ui-input" id="email" name="email" type="email" value="{ email }" placeholder="you@example.org" autocomplete="email" required>
            </div>
            <div class="ui-field">
                <label class="ui-label" for="password">Password</label>
                <input class="ui-input" id="password" name="password" type="password" autocomplete="new-password" required>
                <p class="ui-hint">At least 8 characters.</p>
            </div>
            <button class="ui-btn ui-btn-primary ui-btn-lg" type="submit">Create account</button>
        </form>
        <p class="ui-muted">Already have an account? <a class="ui-link" href="/auth/login">Sign in</a></p>
    </div>
</main>
