extends "layout"
<main class="ui-main">
    <div class="ui-auth">
        <h1 class="ui-h1-sm">Sign in</h1>
        if (problem != "") {
        <div class="ui-alert ui-alert-danger" role="alert"><span class="hero-exclamation-triangle size-5" aria-hidden="true"></span><span>{ problem }</span></div>
        }
        <form class="ui-card ui-form" action="/auth/login" method="post">
            <div class="ui-field">
                <label class="ui-label" for="email">Email</label>
                <input class="ui-input" id="email" name="email" type="email" value="{ email }" placeholder="you@example.org" autocomplete="email" required autofocus>
            </div>
            <div class="ui-field">
                <label class="ui-label" for="password">Password</label>
                <input class="ui-input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="ui-btn ui-btn-primary ui-btn-lg" type="submit">Sign in</button>
        </form>
        <p class="ui-muted">New here? <a class="ui-link" href="/auth/register">Create an account</a></p>
    </div>
</main>
