extends "layout"
<main class="ui-main">
    <div class="ui-auth ui-auth-wide">
        <h1 class="ui-h1-sm">Account</h1>
        <section class="ui-card ui-form">
            <div class="ui-who">
                <span class="ui-avatar ui-avatar-lg" aria-hidden="true"><span class="hero-user size-7"></span></span>
                <div class="ui-stack">
                    <b class="ui-who-name">{ name }</b>
                    <span class="ui-muted">{ email }</span>
                </div>
            </div>
            <dl class="ui-dl ui-dl-tight">
                <dt>Role</dt><dd>{ role }</dd>
            </dl>
            <div class="ui-row-actions">
                <a class="ui-btn ui-btn-secondary" href="/bookings">My bookings</a>
                <form action="/auth/logout" method="post"><button class="ui-btn ui-btn-quiet" type="submit">Sign out</button></form>
            </div>
        </section>
    </div>
</main>
