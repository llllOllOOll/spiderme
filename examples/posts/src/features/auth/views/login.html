extends "layout"

<main class="ui-narrow">
    <h1 class="ui-headline ui-headline-sm">Sign in</h1>

    <form class="ui-card ui-form" action="/auth/login" method="post">
        if (problem != "") {
        <p class="ui-alert" role="alert">{ problem }</p>
        }

        <div class="ui-field">
            <label class="ui-label" for="email">Email</label>
            <input class="ui-input" id="email" name="email" type="email" value="{ email }" autocomplete="email" required>
        </div>
        <div class="ui-field">
            <label class="ui-label" for="password">Password</label>
            <input class="ui-input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div class="ui-actions">
            <button class="ui-btn ui-btn-primary ui-btn-lg" type="submit">Sign in</button>
            <a class="ui-link" href="/auth/register">Create an account</a>
        </div>
    </form>
</main>
