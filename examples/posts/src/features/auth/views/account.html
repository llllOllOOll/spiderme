extends "layout"

<main class="ui-narrow">
    <BackLink href="/posts" label="All posts" />

    <h1 class="ui-headline ui-headline-sm">Your account</h1>

    <div class="ui-card ui-form">
        <dl class="ui-facts">
            <div>
                <dt>Name</dt>
                <dd>{ name }</dd>
            </div>
            <div>
                <dt>Email</dt>
                <dd>{ email }</dd>
            </div>
        </dl>

        <form class="ui-actions" action="/auth/logout" method="post">
            <button class="ui-btn ui-btn-outline" type="submit">Sign out</button>
        </form>
    </div>
</main>
