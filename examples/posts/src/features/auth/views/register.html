extends "layout"

<main class="ui-narrow">
    <h1 class="ui-headline ui-headline-sm">Create an account</h1>

    <form class="ui-card ui-form" action="/auth/register" method="post">
        if (problem != "") {
        <p class="ui-alert" role="alert">{ problem }</p>
        }

        <div class="ui-field">
            <label class="ui-label" for="name">Name</label>
            <input class="ui-input" id="name" name="name" type="text" value="{ name }" autocomplete="name" maxlength="80" required aria-describedby="name-note">
            <p class="ui-hint" id="name-note">Shown on the posts you write.</p>
        </div>
        <div class="ui-field">
            <label class="ui-label" for="email">Email</label>
            <input class="ui-input" id="email" name="email" type="email" value="{ email }" autocomplete="email" required>
        </div>
        <div class="ui-field">
            <label class="ui-label" for="password">Password</label>
            <input class="ui-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-note">
            <p class="ui-hint" id="password-note">At least 8 characters.</p>
        </div>

        <div class="ui-actions">
            <button class="ui-btn ui-btn-primary ui-btn-lg" type="submit">Create account</button>
            <a class="ui-link" href="/auth/login">Sign in instead</a>
        </div>
    </form>
</main>
