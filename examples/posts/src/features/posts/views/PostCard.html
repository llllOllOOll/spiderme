<article class="ui-post">
    <div class="ui-post-rail">
        <span class="ui-avatar ui-avatar-{ tone }" aria-hidden="true">{ initials }</span>
        <span class="ui-thread" aria-hidden="true"></span>
    </div>
    <div class="ui-post-body">
        <p class="ui-byline"><span class="ui-author">{ author }</span> <span class="ui-when">{ written }</span></p>
        <h2 class="ui-post-title"><a href="/posts/{ id }">{ title }</a></h2>
        <p class="ui-excerpt">{ excerpt }</p>
        <a class="ui-link ui-read" href="/posts/{ id }" aria-label="Read post: { title }">Read post</a>
    </div>
</article>
